# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
      - id: fix-ligatures
      - id: fix-spaces
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        # args:
        #   - "--write-changes"
  - repo: https://github.com/sstallion/vimwiki-cli
    rev: v1.2.0
    hooks:
      - id: vimwiki-cli
        stages:
          - pre-commit
        verbose: true
        files: \.wiki$
  - repo: local
    hooks:
      - id: encode-html-anchors
        name: Percent-encode HTML href fragments
        language: unsupported_script
        entry: .pre_commit_hooks/encode-html-anchors.py
        stages:
          - pre-commit
        # docs/*.html is gitignored, so no staged files would ever match.
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: ghp-import
        name: Update Github Pages
        language: unsupported_script
        require_serial: true
        stages:
          - pre-push
        verbose: true
        entry: .pre_commit_hooks/gh-pages.sh
